# Builds the container image when a GitHub release is published, with tag v<version>, and
# pushes it to ghcr.io/stefankuburovic/ng-checkup as <version> and the moving <major> (2).
#
# The image is built from this commit's source (see Dockerfile), so it does not wait for npm
# to serve the release. A provenance attestation links the image to this build:
#   gh attestation verify oci://ghcr.io/stefankuburovic/ng-checkup:2.5.0 --owner stefankuburovic
name: Docker

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The tag names the version being built
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/stefankuburovic/ng-checkup:${{ steps.version.outputs.version }}
            ghcr.io/stefankuburovic/ng-checkup:${{ steps.version.outputs.major }}
          labels: |
            org.opencontainers.image.source=https://github.com/stefankuburovic/ng-checkup
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
      - name: The image runs
        run: docker run --rm ghcr.io/stefankuburovic/ng-checkup:${{ steps.version.outputs.version }} --version
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/stefankuburovic/ng-checkup
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
